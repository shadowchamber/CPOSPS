name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional package version override (e.g. 1.0.1). Leave empty to use csproj Version.'
        required: false
        default: ''

jobs:
  pack-and-publish:
    runs-on: windows-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      packages: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Resolve version from tag
        id: ver
        run: |
          $override = '${{ github.event.inputs.version }}'.Trim()
          if ($override) {
            Write-Host "Using workflow_dispatch version: $override"
            "version=$override" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            return
          }
          $ref = '${{ github.ref }}'
          if ($ref -match 'refs/tags/v(.+)$') {
            $v = $Matches[1]
            Write-Host "Using tag version: $v"
            "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host 'No tag/override; using csproj Version'
            "version=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Restore
        run: dotnet restore CPOSPS.sln --configfile nuget.config
        env:
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
          DOTNET_NOLOGO: true

      - name: Pack
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $args = @('pack','src/CPOSPS/CPOSPS.csproj','-c','Release','-o','artifacts','--no-restore')
          $v = '${{ steps.ver.outputs.version }}'.Trim()
          if ($v) { $args += "/p:Version=$v"; $args += "/p:PackageVersion=$v" }
          & dotnet @args
          if ($LASTEXITCODE -ne 0) { throw "dotnet pack failed with exit $LASTEXITCODE" }
          Get-ChildItem artifacts | ForEach-Object { Write-Host $_.Name }

      - name: Upload nupkg
        uses: actions/upload-artifact@v4
        with:
          name: cposps-nupkg-release
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: Push to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $owner = '${{ github.repository_owner }}'.ToLowerInvariant()
          $source = "https://nuget.pkg.github.com/$owner/index.json"
          dotnet nuget remove source github-cposps 2>$null
          dotnet nuget add source $source --name github-cposps --username azure --password $env:GITHUB_TOKEN --store-password-in-clear-text
          $pkgs = @(Get-ChildItem -Path artifacts -Filter *.nupkg -ErrorAction Stop)
          foreach ($pkg in $pkgs) {
            Write-Host "Pushing $($pkg.Name) to GitHub Packages"
            & dotnet nuget push $pkg.FullName --api-key $env:GITHUB_TOKEN --source github-cposps --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "GitHub Packages push failed for $($pkg.Name)" }
          }

      - name: NuGet login (OIDC to temp API key)
        uses: NuGet/login@v1
        id: login
        continue-on-error: true
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          OIDC_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          NUGET_API_KEY_SECRET: ${{ secrets.NUGET_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $key = "$env:OIDC_API_KEY".Trim()
          $auth = 'OIDC'
          if (-not $key) {
            $key = "$env:NUGET_API_KEY_SECRET".Trim()
            $auth = 'NUGET_API_KEY secret'
          }
          if (-not $key) {
            throw "nuget.org auth unavailable (OIDC login outcome: ${{ steps.login.outcome }}). Set NUGET_USER + Trusted Publishing, or NUGET_API_KEY."
          }
          Write-Host "Pushing to nuget.org with $auth (key length $($key.Length))"
          $pkgs = @(Get-ChildItem -Path artifacts -Filter *.nupkg -ErrorAction Stop)
          foreach ($pkg in $pkgs) {
            Write-Host "Pushing $($pkg.FullName)"
            & dotnet nuget push $pkg.FullName `
              --api-key $key `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "dotnet nuget push failed with exit $LASTEXITCODE for $($pkg.Name)" }
          }
          $ver = '${{ steps.ver.outputs.version }}'.Trim()
          if (-not $ver) {
            [xml]$csproj = Get-Content src/CPOSPS/CPOSPS.csproj
            $ver = $csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          }
          $url = "https://api.nuget.org/v3-flatcontainer/cposps/$ver/cposps.$ver.nupkg"
          Write-Host "Verifying $url"
          $ok = $false
          for ($i = 1; $i -le 18; $i++) {
            try {
              Invoke-WebRequest -Uri $url -Method Head -UseBasicParsing | Out-Null
              $ok = $true
              Write-Host "nuget.org has cposps $ver"
              break
            } catch {
              Write-Host "Attempt $i : not visible yet"
              Start-Sleep -Seconds 10
            }
          }
          if (-not $ok) { throw "Push reported success but $url is still 404 after wait. Check nuget.org ownership / Trusted Publishing." }
